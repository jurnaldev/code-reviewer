discord:
  token: env:DISCORD_TOKEN
  app_id: env:DISCORD_APP_ID
  guild_id: ""           # optional: register commands in a single guild for instant rollout
  allowed_user_ids: []   # empty => allow everyone
  allowed_role_ids: []
gitlab:
  base_url: https://gitlab.example.com
  token: env:GITLAB_TOKEN
llm:
  provider: anthropic                   # anthropic | openai | ollama | openrouter
  model: claude-sonnet-4-6
  api_key: env:ANTHROPIC_API_KEY
  base_url: ""                          # openrouter default https://openrouter.ai/api ; ollama default http://localhost:11434
  referer: ""                           # openrouter only: HTTP-Referer for app ranking
  title: ""                             # openrouter only: X-Title for app ranking
review:
  max_file_tokens: 8000
  max_mr_tokens: 200000
  max_concurrent_chunks: 4
  job_timeout: 10m
  llm_call_timeout: 90s
  ignore_globs:
    - "**/*.lock"
    - "vendor/**"
    - "node_modules/**"
    - "**/*.gen.*"
    - "**/*.min.*"
  deep_mode_default: false

memory:
  enabled: false                          # set true to opt in
  recall_token_budget: 2000
  http_timeout: 10s
  mem9:
    enabled: true
    base_url: https://api.mem9.ai         # or http://localhost:8080
    api_key: env:MEM9_API_KEY
    conventions_top_k: 20
    summaries_top_k: 5
  repo_rules:
    enabled: true
    path: .review/rules.md
  mirror:
    enabled: true
    dir: ~/.cache/gitlab-mr-bot/memory
